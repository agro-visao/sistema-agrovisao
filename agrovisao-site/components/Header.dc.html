<x-dc>
<!-- ─── NAVIGATION ─────────────────────────────────────────────────── -->
<nav class="nav" style="position: fixed; top: 0; left: 0; right: 0; z-index: 1000; {{ navPaddingStyle }}; display: flex; align-items: center; justify-content: space-between; background: {{ navBg }}; border-bottom: {{ navBorder }}; {{ navBoxShadowStyle }}; transition: background 0.5s ease, border-bottom-color 0.5s ease;">
  <div class="nav-logo" style="{{ navEntryStyle }}">
    <a href="./index.html" style="display: flex; align-items: center; gap: 14px; text-decoration: none; color: {{ logoColor }}; transition: color 0.5s ease;">
      <img src="./assets/logos/agrovisao/logo-agro-visao-v1.png" alt="AgroVisão" style="height: {{ logoHeight }}; width: 130px; display: block; object-fit: cover;">
    </a>
  </div>
  <button class="nav-hamburger" aria-label="Abrir menu" aria-expanded="false" aria-controls="drawer" style="color: {{ navColor }};">
    <svg width="22" height="22" viewBox="0 0 22 22" fill="none" aria-hidden="true"><rect y="3" width="22" height="2.5" rx="1.25" fill="currentColor"/><rect y="9.75" width="22" height="2.5" rx="1.25" fill="currentColor"/><rect y="16.5" width="22" height="2.5" rx="1.25" fill="currentColor"/></svg>
  </button>
  <div class="nav-links" style="{{ navLinksStyle }}; display: flex; align-items: center; gap: {{ navGap }};">
    <a href="./index.html" style="font-family: 'Manrope', sans-serif; font-size: 11px; font-weight: 600; color: {{ navColor }}; text-decoration: none; letter-spacing: {{ letterSpacing }}; text-transform: uppercase; text-shadow: {{ navTextShadow }}; {{ homeActiveStyle }}; transition: opacity 0.2s, color 0.5s;" style-hover="{{ homeHoverStyle }}">Home</a>
    <a href="./sobre.html" style="font-family: 'Manrope', sans-serif; font-size: 11px; font-weight: 600; color: {{ navColor }}; text-decoration: none; letter-spacing: {{ letterSpacing }}; text-transform: uppercase; text-shadow: {{ navTextShadow }}; {{ sobreActiveStyle }}; transition: opacity 0.2s, color 0.5s;" style-hover="{{ sobreHoverStyle }}">Sobre</a>
    <a href="./servicos.html" style="font-family: 'Manrope', sans-serif; font-size: 11px; font-weight: 600; color: {{ navColor }}; text-decoration: none; letter-spacing: {{ letterSpacing }}; text-transform: uppercase; text-shadow: {{ navTextShadow }}; {{ servicosActiveStyle }}; transition: opacity 0.2s, color 0.5s;" style-hover="{{ servicosHoverStyle }}">Serviços</a>
    <a href="./projetos.html" style="font-family: 'Manrope', sans-serif; font-size: 11px; font-weight: 600; color: {{ navColor }}; text-decoration: none; letter-spacing: {{ letterSpacing }}; text-transform: uppercase; text-shadow: {{ navTextShadow }}; {{ projetosActiveStyle }}; transition: opacity 0.2s, color 0.5s;" style-hover="{{ projetosHoverStyle }}">Projetos</a>
    <a href="./contato.html" style="font-family: 'Manrope', sans-serif; font-size: 11px; font-weight: 600; color: {{ navColor }}; text-decoration: none; letter-spacing: {{ letterSpacing }}; text-transform: uppercase; text-shadow: {{ navTextShadow }}; {{ contatoActiveStyle }}; transition: opacity 0.2s, color 0.5s;" style-hover="{{ contatoHoverStyle }}">Contato</a>
    <a href="#" onClick="{{ openModal }}" style="display: inline-block; padding: 11px 26px; background: #315B2C; color: #F6F4EF; font-family: 'Manrope', sans-serif; font-size: 11px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; text-decoration: none; border-radius: 8px; transition: background 0.25s;" style-hover="background: #254822;">Fale Conosco</a>
  </div>
</nav>
<!-- ─── DRAWER ─────────────────────────────────────────────────────── -->
<div class="drawer-overlay" aria-hidden="true"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-label="Menu de navegação" aria-hidden="true">
  <div class="drawer-header">
    <img src="./assets/logos/agrovisao/logo-agro-visao-v1.png" alt="AgroVisão" class="drawer-logo">
    <button class="drawer-close" aria-label="Fechar menu">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M3 3l14 14M17 3L3 17" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
  </div>
  <nav class="drawer-nav" aria-label="Menu principal">
    <a href="./index.html" class="{{ homeDrawerClass }}">Home</a>
    <a href="./sobre.html" class="{{ sobreDrawerClass }}">Sobre</a>
    <a href="./servicos.html" class="{{ servicosDrawerClass }}">Serviços</a>
    <a href="./projetos.html" class="{{ projetosDrawerClass }}">Projetos</a>
    <a href="./contato.html" class="{{ contatoDrawerClass }}">Contato</a>
  </nav>
  <div class="drawer-footer">
    <a href="#" class="drawer-cta" onClick="{{ openModal }}">Fale Conosco</a>
  </div>
</aside>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{
  &quot;activePage&quot;: { &quot;default&quot;: &quot;home&quot; },
  &quot;openModal&quot;: {},
  &quot;logoHeight&quot;: { &quot;default&quot;: &quot;55px&quot; },
  &quot;navPadding&quot;: { &quot;default&quot;: &quot;22px 64px&quot; },
  &quot;navGap&quot;: { &quot;default&quot;: &quot;40px&quot; },
  &quot;letterSpacing&quot;: { &quot;default&quot;: &quot;0.14em&quot; },
  &quot;boxShadow&quot;: { &quot;default&quot;: &quot;&quot; }
}">
class Component extends DCLogic {
  state = { scrolled: true, entered: false };

  componentDidMount() {
    setTimeout(() => this.setState({ entered: true }), 80);
    this._onScroll = () => {
      const scrolled = true;
      if (scrolled !== this.state.scrolled) this.setState({ scrolled });
    };
    window.addEventListener('scroll', this._onScroll, { passive: true });
  }

  componentWillUnmount() {
    window.removeEventListener('scroll', this._onScroll);
  }

  renderVals() {
    const { scrolled, entered } = this.state;
    const page = this.props.activePage || 'home';

    const fadeDown = (d) => ({
      opacity: entered ? 1 : 0,
      transform: entered ? 'translateY(0px)' : 'translateY(-10px)',
      transition: `opacity 0.7s ease ${d}s, transform 0.7s ease ${d}s`,
    });

    const activeStyle = 'border-bottom: 1px solid currentColor; padding-bottom: 2px;';
    const linkActive = (p) => page === p ? activeStyle : '';
    const linkHover = (p) => page !== p ? 'opacity: 0.72;' : '';
    const drawerClass = (p) => page === p ? 'drawer-link drawer-link--active' : 'drawer-link';

    const shadowProp = this.props.boxShadow;
    const navBoxShadowStyle = shadowProp
      ? (scrolled ? `box-shadow: ${shadowProp}` : 'box-shadow: none')
      : '';

    return {
      navBg:              scrolled ? '#FFFFFF' : 'transparent',
      navBorder:          scrolled ? '1px solid rgba(49,91,44,0.1)' : '1px solid transparent',
      navColor:           scrolled ? '#1a1a18' : '#FFFFFF',
      logoColor:          scrolled ? '#315B2C' : '#FFFFFF',
      navTextShadow:      scrolled ? 'none' : '0 1px 6px rgba(0,0,0,0.55)',
      navEntryStyle:      fadeDown(0.2),
      navLinksStyle:      fadeDown(0.35),
      navPaddingStyle:    `padding: ${this.props.navPadding || '22px 64px'}`,
      navGap:             this.props.navGap || '40px',
      letterSpacing:      this.props.letterSpacing || '0.14em',
      logoHeight:         this.props.logoHeight || '55px',
      navBoxShadowStyle,
      openModal:          this.props.openModal,
      homeActiveStyle:    linkActive('home'),
      sobreActiveStyle:   linkActive('sobre'),
      servicosActiveStyle: linkActive('servicos'),
      projetosActiveStyle: linkActive('projetos'),
      contatoActiveStyle: linkActive('contato'),
      homeHoverStyle:     linkHover('home'),
      sobreHoverStyle:    linkHover('sobre'),
      servicosHoverStyle: linkHover('servicos'),
      projetosHoverStyle: linkHover('projetos'),
      contatoHoverStyle:  linkHover('contato'),
      homeDrawerClass:    drawerClass('home'),
      sobreDrawerClass:   drawerClass('sobre'),
      servicosDrawerClass: drawerClass('servicos'),
      projetosDrawerClass: drawerClass('projetos'),
      contatoDrawerClass: drawerClass('contato'),
    };
  }
}
</script>
