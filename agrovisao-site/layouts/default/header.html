<!-- ─── layouts/default/header.html ───────────────────────────────────
     Referência do header compartilhado. O componente real está em
     components/Header.dc.html e é importado via dc-import.

     Props aceitos pelo Header:
       activePage  : 'home' | 'sobre' | 'servicos' | 'projetos' | 'contato'
       openModal   : função que abre o modal de contato
       logoHeight  : altura do logo (default: '55px') — varia por página
       navPadding  : padding do nav (default: '22px 64px')
       navGap      : gap entre links (default: '40px')
       letterSpacing: espaçamento de letras (default: '0.14em')
       boxShadow   : sombra do nav quando scrollado (default: '')

     Exemplo de uso:
       <dc-import name="Header" activePage="home"
         openModal="{{ openModal }}" navPadding="20px 64px" navGap="36px" />
     ─────────────────────────────────────────────────────────────────── -->
