<!-- ─── layouts/default/footer.html ───────────────────────────────────
     Referência do footer compartilhado. O componente real está em
     components/Footer.dc.html e é importado via dc-import.

     Props aceitos pelo Footer:
       variant : 'light' (fundo branco) | 'dark' (fundo escuro)
                  Default: 'light'

     Variantes por página:
       - index.html    → variant="light"
       - sobre.html    → variant="dark"
       - servicos.html → variant="dark"
       - projetos.html → variant="dark"
       - contato.html  → variant="dark"

     Exemplo de uso:
       <dc-import name="Footer" variant="dark" />
     ─────────────────────────────────────────────────────────────────── -->
