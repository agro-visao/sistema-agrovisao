<!-- ─── layouts/default/layout.html ───────────────────────────────────
     Layout padrão do site AgroVisão. Toda página estende este layout.
     Componentes compartilhados são importados via dc-import.
     O conteúdo específico de cada página fica entre Header e Footer.

     Uso (em cada página HTML dentro de <x-dc>):

       <dc-import name="Header" activePage="home" openModal="{{ openModal }}" />

       <!-- conteúdo da página -->
       <section class="hero">...</section>
       <section class="section-services">...</section>

       <dc-import name="WhatsAppFab" />
       <dc-import name="Footer" variant="light" />
     ─────────────────────────────────────────────────────────────────── -->
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,600&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./assets/css/reset.css">
  <link rel="stylesheet" href="./assets/css/variables.css">
  <link rel="stylesheet" href="./assets/css/global.css">
  <link rel="stylesheet" href="./assets/css/components.css">
  <link rel="stylesheet" href="./assets/css/responsive.css">
</helmet>

<dc-import name="Header" activePage="{{ activePage }}" openModal="{{ openModal }}" />

<!-- ── CONTEÚDO DA PÁGINA ──────────────────────────────────────────── -->
<!-- {page-content} -->

<dc-import name="WhatsAppFab" waHref="{{ waHref }}" />
<dc-import name="Footer" variant="{{ footerVariant }}" />
</x-dc>
<script src="./assets/js/main.js"></script>
</body>
</html>
